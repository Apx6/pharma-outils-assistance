# Build du client « Pharma-Outils Assistance », basé sur RustDesk 1.4.9 :
#   - Windows x64 (.exe portable + .msi), pour les officines
#   - macOS Apple Silicon (.dmg), pour les postes « pilotes »
# Le même client sait piloter et être piloté, sur les deux systèmes.
#
# Dérivé des jobs `build-for-windows-flutter` et `build-for-macOS` de
# .github/workflows/flutter-build.yml (tag 1.4.9), complétés par :
#   - l'intégration du serveur / de la clé / du nom d'application (pharma/patch-config.sh)
#   - les visuels et propriétés des fichiers (pharma/apply-branding.sh)
#   - le renommage de l'app macOS (pharma/patch-macos.py)
#   - la signature Windows via Azure Artifact Signing (optionnelle, activée si configurée)
#   - une release GitHub en brouillon (rien n'est publié automatiquement)
#
# macOS : signature Developer ID + notarisation Apple si les secrets APPLE_* sont présents
# (voir client/apple/SIGNATURE-MAC.md du dépôt « RustDesk outils ») ; sinon signature ad hoc.
#   Secrets : APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD,
#             APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#
# Configuration du fork (Settings → Secrets and variables → Actions) :
#   Secrets   : RS_PUB_KEY                       (obligatoire)
#               AZURE_TENANT_ID, AZURE_CLIENT_ID,
#               AZURE_SUBSCRIPTION_ID            (signature Windows)
#   Variables : AZURE_SIGNING_ENDPOINT,          (ex. https://weu.codesigning.azure.net/)
#               AZURE_SIGNING_ACCOUNT,
#               AZURE_CERT_PROFILE               (signature ; si absentes => build non signé)
# Ces valeurs sont posées par azure/setup-signing.sh (dépôt « RustDesk outils »).
# Authentification Azure par OIDC (identité fédérée) : aucun mot de passe stocké dans GitHub,
# seule la branche autorisée du dépôt peut obtenir un jeton.

name: Pharma-Outils - Build client

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Tag de la release brouillon (ex. pharma-1.4.9-1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write   # OIDC : jeton pour Azure (signature Windows)

env:
  # --- Personnalisation pharma-outils ---
  RENDEZVOUS_SERVER: "support.pharma-outils.fr"
  APP_NAME: "PharmaOutils"
  # Éditeur : raison sociale EXACTE (Kbis), identique à l'identité validée chez Microsoft
  # (c'est le nom affiché par Windows comme éditeur du certificat).
  # Utilisé pour : propriétés des fichiers, éditeur du MSI, copyright macOS.
  COMPANY_NAME: "Holding Dioux"
  OUTPUT_PREFIX: "pharma-outils-assistance"
  # --- Repris de flutter-build.yml (1.4.9) : à resynchroniser à chaque mise à jour amont ---
  SCITER_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: Windows x64
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    env:
      SIGNING_ENABLED: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------
      # Personnalisation : doit précéder toute compilation Rust.
      # Échoue si config.rs a changé en amont, pour ne jamais produire un
      # client relié aux serveurs publics RustDesk.
      # ------------------------------------------------------------------
      - name: Configurer serveur pharma-outils
        shell: bash
        env:
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: bash pharma/patch-config.sh

      - name: Appliquer les visuels pharma-outils
        shell: bash
        run: bash pharma/apply-branding.sh

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # Le binaire doit porter le nom de l'application (installeur MSI, installation, service)
          Rename-Item ./rustdesk/rustdesk.exe "${{ env.APP_NAME }}.exe"

          # Pilote d'écran virtuel (usbmmidd_v2)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Pilote d'imprimante distante (vérifié par checksum, facultatif)
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } else {
                Write-Output "Printer driver checksums do not match, ignore."
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      # Connexion juste avant la signature : le jeton Azure CLI reste valable pour les deux
      # étapes de signature (quelques minutes d'écart).
      - name: Azure login (OIDC)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signe les binaires du dossier (exe/dll de premier niveau) AVANT empaquetage,
      # sinon l'exe extrait au lancement ne serait pas signé.
      - name: Sign application files
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\rustdesk
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Uniquement la session ouverte par azure/login (OIDC)
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/${{ env.APP_NAME }}.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/${{ env.OUTPUT_PREFIX }}-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk -c --app-name "${{ env.APP_NAME }}" -m "${{ env.COMPANY_NAME }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/${{ env.OUTPUT_PREFIX }}-${{ env.VERSION }}-x86_64.msi

      - name: Sign installers
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\SignOutput
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Uniquement la session ouverte par azure/login (OIDC)
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Upload Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pharma-release-windows
          # Dépôt public : les artefacts sont téléchargeables par tout compte GitHub.
          # Ils ne servent qu'à passer les fichiers au job « release » : 1 jour suffit.
          retention-days: 1
          path: |
            ./SignOutput/*.exe
            ./SignOutput/*.msi

  build-macos-arm64:
    name: macOS arm64
    needs: [generate-bridge]
    runs-on: macos-14
    env:
      MAC_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Configurer serveur pharma-outils
        shell: bash
        env:
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: bash pharma/patch-config.sh

      - name: Appliquer les visuels pharma-outils
        shell: bash
        run: bash pharma/apply-branding.sh

      - name: Renommer l'application macOS
        shell: bash
        run: python3 pharma/patch-macos.py

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x : les bibliothèques multimédia ne compilent pas avec NASM 3.x (cf. amont)
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-14

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Vérifier l'application
        run: |
          APP="./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"
          test -x "$APP/Contents/MacOS/${APP_NAME}" || { echo "Exécutable ${APP_NAME} absent du bundle"; exit 1; }
          test -x "$APP/Contents/MacOS/service" || { echo "Binaire service absent du bundle"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          codesign -dv "$APP" 2>&1 | head -5

      - name: Préparer la signature Apple
        if: env.MAC_SIGNING == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: bash pharma/sign-macos.sh keychain

      - name: Signer l'application (Developer ID)
        if: env.MAC_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: bash pharma/sign-macos.sh app "./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"

      - name: Create dmg
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p dist
          create-dmg \
            --volname "Pharma-Outils Assistance" \
            --icon "${APP_NAME}.app" 200 190 --hide-extension "${APP_NAME}.app" \
            --window-size 800 400 --app-drop-link 600 185 \
            "dist/${OUTPUT_PREFIX}-${VERSION}-aarch64.dmg" \
            "./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"

      - name: Signer, notariser et agrafer le dmg
        if: env.MAC_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash pharma/sign-macos.sh dmg "dist/${OUTPUT_PREFIX}-${VERSION}-aarch64.dmg"

      - name: Nettoyer le trousseau
        if: always() && env.MAC_SIGNING == 'true'
        run: bash pharma/sign-macos.sh cleanup

      - name: Upload macOS release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pharma-release-macos
          retention-days: 1
          path: dist/*.dmg

  # Un seul job crée la release : deux jobs qui créent chacun un brouillon avec le
  # même tag produiraient deux releases distinctes.
  release:
    name: Release brouillon
    needs: [build-windows-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    env:
      SIGNING_ENABLED: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
      MAC_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pharma-release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS.txt

      # Release en BROUILLON : à relire, tester puis publier manuellement.
      - name: Draft release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          draft: true
          prerelease: true
          tag_name: ${{ inputs.release-tag }}
          name: "Pharma-Outils Assistance ${{ env.VERSION }} (${{ inputs.release-tag }})"
          body: |
            Client d'assistance à distance Pharma-Outils, basé sur RustDesk ${{ env.VERSION }} (AGPL-3.0).
